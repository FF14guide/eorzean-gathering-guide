name: ビルドと公開

on:
  # 毎日正午（JST）に上流データを取り直す。パッチで採取ポイントが増減しても追従する。
  schedule:
    - cron: '0 3 * * *'
  # 手動実行。パッチ直後はこれを押すのが早い
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # リポジトリの Settings → Secrets and variables → Actions → Variables で SITE_URL を設定する。
      # 未設定でもビルドは通る（OGP/canonical が既定ドメインになるだけ）。
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: サイトを生成（上流データを取り直す）
        run: node tools/build.mjs --refresh

      # 生成物はリポジトリに置かない（毎ビルドで作り直す）ので、コミットは不要。
      # 日次のスケジュール実行そのものが再ビルドのきっかけになる。

      # GitHub Pages で公開する場合のみ。Cloudflare Pages を使うなら不要。
      - uses: actions/configure-pages@v5
        if: vars.DEPLOY_GITHUB_PAGES == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.DEPLOY_GITHUB_PAGES == 'true'
        with: { path: dist }

  deploy:
    needs: build
    if: vars.DEPLOY_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
