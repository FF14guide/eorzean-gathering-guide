name: ビルドと公開

on:
  # 毎日正午（JST）に上流データを取り直し、Cloudflare Pagesの本番ビルドを起動する。
  schedule:
    - cron: '0 3 * * *'
  # パッチ直後などに、上流データの確認とCloudflare Pagesの本番ビルドを手動で起動する。
  workflow_dispatch:
  # 通常のソース更新時はCloudflareのGit連携がmainブランチを自動デプロイする。
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Variables の SITE_URL。未設定でもビルドは通るが、本番URLを必ず設定すること。
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: サイトを生成（上流データを取り直す）
        run: node tools/build.mjs --refresh

      # schedule / workflow_dispatch のときだけ、Cloudflare PagesのGit連携ビルドを起動する。
      # URLは認証不要の秘密情報のため、GitHub Actions Secretとしてのみ保存する。
      - name: Cloudflare Pages の本番ビルドを起動
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_PAGES_DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK が未設定です。GitHub Actions の Secret に登録してください。" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            --request POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
          echo "Cloudflare Pages の本番ビルドを起動しました。"

      # 生成物はリポジトリに置かない。Cloudflare Pagesはデプロイフックで
      # mainブランチの最新ソースを再ビルドする。

      # GitHub Pages を選ぶ場合のみ、生成物をGitHub Pagesへデプロイする。
      - uses: actions/configure-pages@v5
        if: vars.DEPLOY_GITHUB_PAGES == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.DEPLOY_GITHUB_PAGES == 'true'
        with: { path: dist }

  deploy:
    needs: build
    if: vars.DEPLOY_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
